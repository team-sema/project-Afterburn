<svg xmlns="http://www.w3.org/2000/svg" width="16" height="64" viewBox="0 0 8 32">
  <!-- Sniper round. The textured bullet quad shows the sprite's bottom edge leading (travel), so the bright head sits at the bottom and the tail fades out toward the top. -->
  <defs>
    <linearGradient id="tail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <path d="M4 1.5 L5.2 26 A1.2 1.2 0 0 1 2.8 26 Z" fill="url(#tail)"/>
  <circle cx="4" cy="26.2" r="1.6" fill="#fff"/>
</svg>
