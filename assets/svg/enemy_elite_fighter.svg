    <path fill="#fff" d="
    M32 2
    C34 8.5 35.6 14.1 37.6 19.1
    L41.2 27.1 59 35.2 55.2 40.3 38.6 36.3
    L36.7 51.2 32 61.7 27.3 51.2 25.4 36.3
    L8.8 40.3 5 35.2 22.8 27.1 26.4 19.1
    C28.4 14.1 30 8.5 32 2 Z
    "/>
    <!-- Dark, inset canopy. -->
    <path fill="#171b25" d="M32 11.2 28.9 24.2 32 30.2 35.1 24.2Z"/>
